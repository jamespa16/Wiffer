timeout: 0

# Entry 1 (the default): boot into the desktop with one terminal open.
/Wiffer
    protocol: limine
    path: boot():/boot/kernel.elf
    module_path: boot():/boot/rootfs.tar
    module_string: rootfs

# Entry 2: the Part 2 full-screen shell, handy when the WM is broken.
# build/wiffer-nodesktop.iso boots it by default (./run.sh --nodesktop).
/Wiffer (nodesktop)
    protocol: limine
    path: boot():/boot/kernel.elf
    cmdline: nodesktop
    module_path: boot():/boot/rootfs.tar
    module_string: rootfs

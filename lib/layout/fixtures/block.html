<!DOCTYPE html>
<style>
body { margin: 10px; font: 16px sans-serif }
div { background: #ccc }
#fixed { width: 200px; height: 30px }
#pct { width: 50%; height: 20px }
#pad { padding: 5px 10px; border: 3px solid black; height: 20px }
#bb { box-sizing: border-box; width: 100px; padding: 10px; border: 5px solid; height: 40px }
#center { width: 120px; margin: 0 auto; height: 10px }
#right { width: 120px; margin-left: auto; height: 10px }
#minmax { width: 10px; min-width: 50px; height: 10px }
#maxw { max-width: 80px; height: 10px }
#minh { min-height: 25px }
#maxh { height: 100px; max-height: 15px }
.outer { width: 300px; padding: 10px }
.inner { width: 50%; height: 12px; background: #888 }
#huge { width: 99999999999px; height: 1px }
#neg { width: -50px; margin-left: -20px; height: 5px }
</style>
<div id=fixed></div>
<div id=pct></div>
<div id=pad></div>
<div id=bb></div>
<div id=center></div>
<div id=right></div>
<div id=minmax></div>
<div id=maxw></div>
<div id=minh></div>
<div id=maxh></div>
<div class=outer><div class=inner></div></div>
<div id=huge></div>
<div id=neg></div>

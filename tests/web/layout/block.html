<!DOCTYPE html>
<html><head><meta charset=utf-8><title>Layout: block</title>
<style>body{margin:0;font-family:sans-serif}</style></head>
<body>
<div style='margin:10px;padding:10px;border:5px solid #204080;background:#E0E8F8'><div style='margin:10px 0;padding:5px;background:#40A060;height:40px'>inner one</div><div style='margin:10px 0;padding:5px;background:#A06040;width:50%;height:40px'>inner two (half width)</div><p style='margin:1em 0'>Margins between paragraphs collapse. Text wraps at the container width, so a long line of words like this one eventually breaks onto another line.</p><p>Second paragraph.</p></div>

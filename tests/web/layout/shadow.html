<!DOCTYPE html>
<html><head><meta charset=utf-8><title>Layout: shadow</title>
<style>
body { margin: 0; font-family: sans-serif; --accent: #2060E0 }
x-card::part(badge) { background: #E0A020 }
</style></head>
<body>
<!-- Declarative shadow DOM, no script: renders the same as shadow-light.html. -->
<x-card><template shadowrootmode=open>
<style>
:host { display: block; margin: 10px; border: 4px solid #802040; padding: 6px; background: #FFFFFF }
.head { height: 30px; background: var(--accent); color: #FFFFFF }
.badge { display: inline-block; width: 40px; height: 20px }
::slotted(p) { margin: 4px 0; color: #30A050 }
p { color: #FF0000 }
</style>
<div class=head><slot name=title>Untitled</slot></div><span class=badge part=badge></span><slot></slot><div class=foot><slot name=foot>no footer</slot></div>
</template><b slot=title>Declarative card</b><p>First slotted paragraph</p><p>Second slotted paragraph</p></x-card>
<div style="height:40px;background:#C02080"></div>
</body></html>

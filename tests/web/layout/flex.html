<!DOCTYPE html>
<html><head><meta charset=utf-8><title>Layout: flex</title>
<style>body{margin:0;font-family:sans-serif}</style></head>
<body>
<div style='display:flex;height:80px;background:#EEE'><div style='flex:1;background:#E04040'>one</div><div style='flex:2;background:#40E040'>two</div><div style='width:60px;background:#4040E0'>fixed</div></div><div style='display:flex;flex-direction:column;height:150px;margin-top:10px;justify-content:space-between;background:#EEE'><div style='height:20px;background:#C0C020'>top</div><div style='height:20px;background:#20C0C0'>bottom</div></div><div style='display:flex;flex-wrap:wrap;margin-top:10px'><div style='width:90px;height:30px;margin:2px;background:#A0A0F0'>0</div><div style='width:90px;height:30px;margin:2px;background:#A0A0F0'>1</div><div style='width:90px;height:30px;margin:2px;background:#A0A0F0'>2</div><div style='width:90px;height:30px;margin:2px;background:#A0A0F0'>3</div><div style='width:90px;height:30px;margin:2px;background:#A0A0F0'>4</div><div style='width:90px;height:30px;margin:2px;background:#A0A0F0'>5</div><div style='width:90px;height:30px;margin:2px;background:#A0A0F0'>6</div><div style='width:90px;height:30px;margin:2px;background:#A0A0F0'>7</div><div style='width:90px;height:30px;margin:2px;background:#A0A0F0'>8</div><div style='width:90px;height:30px;margin:2px;background:#A0A0F0'>9</div><div style='width:90px;height:30px;margin:2px;background:#A0A0F0'>10</div><div style='width:90px;height:30px;margin:2px;background:#A0A0F0'>11</div></div>
</body></html>

<!DOCTYPE html>
<html><head><meta charset=utf-8><title>Layout: position</title>
<style>body{margin:0;font-family:sans-serif}</style></head>
<body>
<div style='position:absolute;left:300px;top:100px;width:80px;height:60px;background:#8040C0'></div><div style='position:relative;left:20px;top:10px;width:100px;height:40px;background:#C0A020'>relative</div><div style='position:fixed;right:0;bottom:0;width:60px;height:30px;background:#20C0C0'>fixed</div><div style='position:relative;height:200px'><div style='position:absolute;right:10px;top:10px;width:50px;height:50px;background:#E06020'></div><div style='position:absolute;z-index:2;left:10px;top:80px;width:60px;height:60px;background:#2040E0'></div><div style='position:absolute;z-index:1;left:40px;top:100px;width:60px;height:60px;background:#E02040'></div></div>
</body></html>

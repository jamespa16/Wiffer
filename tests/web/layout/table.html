<!DOCTYPE html>
<html><head><meta charset=utf-8><title>Layout: table</title>
<style>body{margin:0;font-family:sans-serif}</style></head>
<body>
<table border=1 cellpadding=4 style='margin:10px;border-collapse:collapse'><caption>caption</caption><tr><th>Name<th>Value<th>Notes</tr><tr><td>alpha<td style='background:#E0F0E0'>1<td rowspan=2>spans two rows</tr><tr><td>beta<td>2</tr><tr><td colspan=3 style='text-align:center'>a cell spanning all three columns</td></tr></table><table style='width:300px;margin:10px' border=1><tr><td style='width:25%'>25%<td>rest</tr></table>
</body></html>

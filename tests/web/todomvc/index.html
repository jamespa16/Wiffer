<!DOCTYPE html>
<html lang=en><head><meta charset=utf-8><title>Wiffer TodoMVC</title>
<link rel=stylesheet href=app.css>
</head><body>
<!-- A vanilla-JS TodoMVC (the todomvc.com app spec: add, edit, toggle, toggle
     all, delete, filters by URL hash, clear completed, item counter,
     localStorage), written for Wiffer's Phase 9J target-site table. -->
<section class=todoapp>
  <header class=header>
    <h1>todos</h1>
    <input class=new-todo placeholder="What needs to be done?" autofocus>
  </header>
  <section class=main>
    <input id=toggle-all class=toggle-all type=checkbox>
    <label for=toggle-all>Mark all as complete</label>
    <ul class=todo-list></ul>
  </section>
  <footer class=footer>
    <span class=todo-count></span>
    <ul class=filters>
      <li><a href="#/" class=selected>All</a></li>
      <li><a href="#/active">Active</a></li>
      <li><a href="#/completed">Completed</a></li>
    </ul>
    <button class=clear-completed>Clear completed</button>
  </footer>
</section>
<footer class=info><p>Double-click to edit a todo</p></footer>
<script src=app.js></script>
</body></html>

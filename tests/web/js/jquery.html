<!DOCTYPE html>
<html><head><meta charset=utf-8><title>JS jquery start</title>
<script src="/js/jquery.js"></script>
</head><body>
<ul id=list></ul>
<script>
$(function () {
  for (var i = 0; i < 20; i++) $('<li>').text('item ' + i).addClass(i % 2 ? 'odd' : 'even').appendTo('#list');
  document.title = 'JS jquery ' + $.fn.jquery + ' ' + $('#list li.odd').length;
});
</script>
</body></html>

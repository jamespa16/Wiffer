<!DOCTYPE html>
<html><head><meta charset=utf-8><title>JS hostile bomb</title>
<style>body { margin: 0 } #box { width: 200px; height: 80px; background: #6040A0 }</style>
</head><body>
<div id=box></div>
<script>
// A heap bomb: arrays until the page's JS heap cap terminates the script.
(function () { var keep = []; for (;;) keep.push(new Array(1000000).fill(keep.length)); })();
</script>
<script>document.title = 'JS hostile bomb survived'; console.log('next script ran');</script>
</body></html>

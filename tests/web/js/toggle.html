<!DOCTYPE html>
<html><head><meta charset=utf-8><title>JS toggle</title>
<style>
body { margin: 0 }
#box { width: 200px; height: 80px; background: #2040C0 }
#box.on { background: #C04020 }
p { margin: 0; height: 20px }
</style>
</head><body>
<div id=box></div>
<p id=count>0 clicks</p>
<script>
var n = 0;
document.getElementById('box').addEventListener('click', function (e) {
  this.classList.toggle('on');
  n++;
  document.getElementById('count').textContent = n + ' clicks';
  document.title = 'JS toggle ' + n + ' ' + (this.classList.contains('on') ? 'on' : 'off');
  console.log('clicked at ' + e.clientX + ',' + e.clientY);
});
</script>
</body></html>

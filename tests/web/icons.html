<!DOCTYPE html>
<html><head><meta charset=utf-8><title>Icons</title>
<style>
body{margin:0;font-family:sans-serif}
.ic{color:#2060E0}
.sprite{color:#A02020}
.mask{display:block;width:40px;height:40px;background-color:#C02080;-webkit-mask-image:url(img/mask.svg);mask-image:url(img/mask.svg);mask-size:contain;mask-repeat:no-repeat}
.box{position:absolute;top:0;width:40px;height:40px}
</style></head>
<body>
<div class=box style='left:0'><img src=img/icon.svg width=40 height=40></div>
<div class=box style='left:60px'><svg class=ic width=40 height=40 viewBox="0 0 24 24"><rect width=24 height=24 fill=currentColor /><path d="M4 4h8v8H4z" fill=#fff /></svg></div>
<div class=box style='left:120px'><svg class=sprite width=40 height=40><use href="img/sprite.svg#sq"/></svg></div>
<div class=box style='left:180px'><span class=mask></span></div>
<p style='position:absolute;top:60px'>An SVG img, an inline svg, a use sprite and a mask-image icon.</p>
</body></html>
